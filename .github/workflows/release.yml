name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - 0.2.1-alpha.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate annotated release tag
        run: node .github/scripts/release-archive.mjs validate "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
      - run: npm test
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
      - run: .github/scripts/prove-packed-install.sh "${{ matrix.dsh }}"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Validate annotated release tag
        id: release
        run: node .github/scripts/release-archive.mjs validate "$GITHUB_REF_NAME"
      - run: npm install -g npm@11.12.1 && test "$(npm --version)" = '11.12.1'
      - name: Check packed archive
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          sha256sum -c .release.sha256
      - name: Check registry archive
        id: registry
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: node .github/scripts/release-archive.mjs registry "$ARCHIVE"
      - name: Publish prepared archive
        if: steps.registry.outputs.state == 'absent'
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: npm publish "$ARCHIVE" --access public --provenance --tag latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          notes="$(awk -v heading="## $RELEASE_VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          args=(release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME")
          if [[ -n "$notes" ]]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          gh "${args[@]}"
