name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - 0.2.1-alpha.3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
      - run: npm test
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
      - run: .github/scripts/prove-packed-install.sh "${{ matrix.dsh }}"
        env:
          KEEP_PROOF: '1'
      - name: Keep synthetic peer pending-input captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: peer-pending-input-${{ matrix.dsh }}
          path: ${{ runner.temp }}/sessionbus-dsh-proof.*/peer-pending-input/**
          if-no-files-found: error
          retention-days: 7

  peer-floor:
    name: Native DSH alpha.1 refusal below alpha.2 floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
      - run: .github/scripts/prove-peer-floor.sh

  universal:
    name: Universal ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        mode: [npm-global, pnpm10-global, pnpm11-global, pnpm12-global, npx, project, mixed]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash .github/scripts/prove-universal-install.sh "${{ matrix.mode }}"

  gate:
    if: ${{ always() }}
    needs: [compatibility, peer-floor, universal]
    runs-on: ubuntu-latest
    steps:
      - name: Require compatibility matrix
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PEER_FLOOR_RESULT: ${{ needs.peer-floor.result }}
          UNIVERSAL_RESULT: ${{ needs.universal.result }}
        run: test "$COMPATIBILITY_RESULT" = success && test "$PEER_FLOOR_RESULT" = success && test "$UNIVERSAL_RESULT" = success
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish preview
        run: npx pkg-pr-new publish . --compact
